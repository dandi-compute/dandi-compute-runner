name: Prepare queue

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of jobs to add to the queue."
        required: false
        default: "10"
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DANDI_API_KEY: ${{ secrets.DANDI_API_KEY }}
  DANDICOMPUTE_OOP_FAILSAFE_LOG: ${{ vars.DANDICOMPUTE_OOP_FAILSAFE_LOG }}

jobs:
  CheckEngaging:
    name: Pre-run Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          labels: mit,engaging,submitter
          token: ${{ secrets._GITHUB_API_KEY }}

  PrepareQueue:
    needs: CheckEngaging
    name: Prepare AIND queue
    permissions:
      contents: read
    runs-on: [self-hosted, mit, engaging, submitter]

    steps:
      - name: Ensure DANDI CLI is kept up-to-date
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: pip install -U dandi

      - name: Prepare queue
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: |
          git -C ./queue fetch origin
          git -C ./queue reset --hard origin/main
          git -C ./queue clean -fd

          dandicompute queue prepare --queue ./queue/ --pipeline ./aind-ephys-pipeline/ --limit ${{ inputs.limit || 10 }}
          dandicompute queue prepare --queue ./queue/ --pipeline lfp --limit 10

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git -C queue add .
          git -C queue commit --message "update" || true  # || true in case of no changes
          git -C queue push

      - name: Wait before finishing
        run: sleep 120

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckEngaging, PrepareQueue]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check 24-hour cooldown
        id: cooldown
        uses: ./.github/actions/check-cooldown
        with:
          workflow_file: prepare-queue.yml
          token: ${{ github.token }}

      - name: Send email notification on failure
        if: ${{ steps.cooldown.outputs.should_notify == 'true' }}
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI Compute: AIND Queue preparation failed (MIT Engaging dispatch)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: DANDI Compute <dandi-compute@users.noreply.github.com>
          body: |
            The manual dispatch of AIND queue preparation encountered an issue!
            Please check status at: https://github.com/dandi-compute/dandi-compute-runner/actions/workflows/prepare-queue.yml
