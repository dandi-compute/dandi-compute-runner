name: Refresh state

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Create job capsules", "Process AIND Queue", "Prepare AIND job", "Prepare AIND test job"]
    types: [completed]
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DANDI_API_KEY: ${{ secrets.DANDI_API_KEY }}
  DANDI_DEVEL: ${{ secrets.DANDI_DEVEL }}
  DANDICOMPUTE_OOP_FAILSAFE_LOG: ${{ vars.DANDICOMPUTE_OOP_FAILSAFE_LOG }}

jobs:
  CheckEngaging:
    name: Check runner is online
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if runner is offline
        uses: ./.github/actions/check-runner
        with:
          labels: mit,engaging,submitter
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateQueueState:
    needs: CheckEngaging
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Update queue state
    runs-on: [self-hosted, mit, engaging, submitter]
    # Each step records itself in the global logs repository (see launcher/record.sh), inside
    # GitHub's own default shell for bash. Until record.sh is on this machine (the first Update
    # codebase run is what brings it), a step runs in that shell unrecorded rather than failing.
    defaults:
      run:
        shell: bash --noprofile --norc -c "test -x /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh && exec /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh logs refresh-state -- bash --noprofile --norc -eo pipefail $0; echo record.sh not found, running unrecorded >&2; exec bash --noprofile --norc -eo pipefail $0" {0}

    steps:
      - name: Update queue state
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: dandicompute jobs refresh

      - name: Re-write crontab
        run:
          ssh login007
          crontab /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/crontab

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckEngaging, UpdateQueueState]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check 24-hour cooldown
        id: cooldown
        uses: ./.github/actions/check-cooldown
        with:
          workflow_file: update_state.yml
          token: ${{ github.token }}
          # Separate step names keep separate cooldowns, so a runner offline email does not
          # hold back a later email about the workflow itself failing.
          step_name: ${{ needs.CheckEngaging.result == 'failure' && 'Send runner offline notification' || 'Send email notification on failure' }}

      - name: ${{ needs.CheckEngaging.result == 'failure' && 'Send runner offline notification' || 'Send email notification on failure' }}
        if: ${{ steps.cooldown.outputs.should_notify == 'true' }}
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ needs.CheckEngaging.result == 'failure' && 'DANDI Compute: MIT Engaging runner offline (Refresh state)' || 'DANDI Compute: AIND Queue state update failed (MIT Engaging dispatch)' }}"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: DANDI Compute <dandi-compute@users.noreply.github.com>
          body: |
            ${{ needs.CheckEngaging.result == 'failure' && 'The MIT Engaging submitter runner was offline, so this workflow did not run. Restart the runner, then re-run the workflow.' || 'The scheduled run of AIND Queue state update encountered an issue!' }}
            Please check status at: https://github.com/dandi-compute/dandi-compute-runner/actions/workflows/refresh-state.yml
