name: Refresh state

# Rewrites jobs.tsv, paths.tsv and their sidecars in the job capsules and failed runs archive
# Dandisets. It reads only from DANDI and writes only to DANDI, so it runs on a GitHub-hosted
# runner and never needs the cluster or the self-hosted runner. A table that is already up to
# date is not uploaded again, so frequent runs cost only the reads.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Create job capsules", "Process AIND Queue", "Prepare AIND job", "Prepare AIND test job"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DANDI_API_KEY: ${{ secrets.DANDI_API_KEY }}
  DANDI_DEVEL: ${{ secrets.DANDI_DEVEL }}

jobs:
  UpdateQueueState:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Update queue state
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.13"

      # The environment is cached per commit of dandi-compute-core's main and per exact Python
      # version (the venv links to that interpreter), so it is only rebuilt when either changes.
      - name: Resolve dandi-compute-core
        id: core
        run: echo "sha=$(git ls-remote https://github.com/dandi-compute/dandi-compute-core refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore the dandi-compute environment
        id: environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/dandi-compute-env
          key: dandi-compute-env-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ steps.core.outputs.sha }}
          # A cache from an earlier commit still holds every dependency, so only the core itself
          # is reinstalled on top of it.
          restore-keys: dandi-compute-env-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-

      - name: Install dandi-compute-core
        if: ${{ steps.environment.outputs.cache-hit != 'true' }}
        run: |
          python -m venv ~/dandi-compute-env
          ~/dandi-compute-env/bin/pip install --upgrade "dandi-compute-code @ git+https://github.com/dandi-compute/dandi-compute-core@${{ steps.core.outputs.sha }}"

      # The base directory only holds the temporary trees used to upload each table.
      - name: Update queue state
        run: |
          source ~/dandi-compute-env/bin/activate
          mkdir -p "$RUNNER_TEMP/dandi-compute/processing"
          dandicompute jobs refresh --base "$RUNNER_TEMP/dandi-compute"

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [UpdateQueueState]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check 24-hour cooldown
        id: cooldown
        uses: ./.github/actions/check-cooldown
        with:
          workflow_file: refresh-state.yml
          token: ${{ github.token }}

      - name: Send email notification on failure
        if: ${{ steps.cooldown.outputs.should_notify == 'true' }}
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI Compute: refreshing the queue state failed"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: DANDI Compute <dandi-compute@users.noreply.github.com>
          body: |
            Refreshing the queue state (jobs.tsv in the job capsules and failed runs archive Dandisets) encountered an issue!
            Please check status at: https://github.com/dandi-compute/dandi-compute-runner/actions/workflows/refresh-state.yml
