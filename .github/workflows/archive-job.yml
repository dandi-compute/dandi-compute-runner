name: Archive job

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      status:
        description: "Archive every job capsule with this status. Combine with `pipeline` to narrow it to one pipeline."
        required: true
        type: choice
        default: all
        options:
          - all
          - failed
          - pending
          - stalled
      pipeline:
        description: "Archive every job capsule of this pipeline, whatever its status unless `status` is also set."
        required: true
        type: choice
        default: all
        options:
          - all
          - aind+ephys
          - lfp
      path:
        description: "Path of a single job capsule folder, relative to the job capsules Dandiset root. Only used when `status` and `pipeline` are both `all`."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DANDI_API_KEY: ${{ secrets.DANDI_API_KEY }}
  DANDI_DEVEL: ${{ secrets.DANDI_DEVEL }}
  DANDICOMPUTE_OOP_FAILSAFE_LOG: ${{ vars.DANDICOMPUTE_OOP_FAILSAFE_LOG }}

jobs:
  ArchiveJob:
    name: Archive job
    # Started by hand, so there is no runner check: while the runner is offline the job waits for it
    # ("Waiting for a runner to pick up this job") and runs once it is back.
    runs-on: [self-hosted, mit, engaging, submitter]
    # Each step records itself in the global logs repository (see launcher/record.sh), inside
    # GitHub's own default shell for bash. Until record.sh is on this machine (the first Update
    # codebase run is what brings it), a step runs in that shell unrecorded rather than failing.
    defaults:
      run:
        shell: bash --noprofile --norc -c "test -x /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh && exec /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh logs archive-job -- bash --noprofile --norc -eo pipefail $0; echo record.sh not found, running unrecorded >&2; exec bash --noprofile --norc -eo pipefail $0" {0}

    steps:
      - name: Ensure DANDI CLI is kept up-to-date
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: pip install -U dandi

      - name: Archive job
        working-directory: /orcd/data/dandi/001/dandi-compute
        env:
          STATUS: ${{ inputs.status }}
          PIPELINE: ${{ inputs.pipeline }}
          CAPSULE_PATH: ${{ inputs.path }}
        run: |
          if [ "$STATUS" = "all" ] && [ "$PIPELINE" = "all" ]; then
            if [ -z "$CAPSULE_PATH" ]; then
              echo "::error::Provide a job capsule \`path\`, or choose a \`status\` and/or \`pipeline\` to archive."
              exit 1
            fi
            ARGS=(--job "$CAPSULE_PATH")
          else
            if [ -n "$CAPSULE_PATH" ]; then
              echo "::error::\`path\` must be empty when archiving by \`status\` ($STATUS) or \`pipeline\` ($PIPELINE)."
              exit 1
            fi
            ARGS=()
            if [ "$STATUS" != "all" ]; then
              ARGS+=(--status "$STATUS")
            fi
            if [ "$PIPELINE" != "all" ]; then
              ARGS+=(--pipeline "$PIPELINE")
            fi
          fi
          # The command logs to stderr and keeps the output of its `dandi` calls to itself, so its
          # stdout is only the closing report of what was archived.
          dandicompute archive add "${ARGS[@]}" --base /orcd/data/dandi/001/dandi-compute | tee "$RUNNER_TEMP/archive.txt"
          {
            echo "### Archived to the failed runs archive (001873)"
            echo '```'
            head -c 900000 "$RUNNER_TEMP/archive.txt"
            if [ "$(wc -c < "$RUNNER_TEMP/archive.txt")" -gt 900000 ]; then
              echo
              echo "... truncated to fit the 1 MB summary limit; the step log has the full list."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  NotifyOnFailure:
    if: ${{ always() && failure() }}
    needs: [ArchiveJob]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check 24-hour cooldown
        id: cooldown
        uses: ./.github/actions/check-cooldown
        with:
          workflow_file: archive-job.yml
          token: ${{ github.token }}

      - name: Send email notification on failure
        if: ${{ steps.cooldown.outputs.should_notify == 'true' }}
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI Compute: job archiving failed (MIT Engaging dispatch)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: DANDI Compute <dandi-compute@users.noreply.github.com>
          body: |
            The manual dispatch of job archive encountered an issue!
            Please check status at: https://github.com/dandi-compute/dandi-compute-runner/actions/workflows/archive-job.yml
