name: Clean work directory

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DANDICOMPUTE_OOP_FAILSAFE_LOG: ${{ vars.DANDICOMPUTE_OOP_FAILSAFE_LOG }}

jobs:
  # An offline runner skips the self-hosted job rather than failing the run, so a short outage
  # sends no email. Refresh crontab is what reports a runner that stays offline for days.
  CheckEngaging:
    name: Check runner is online
    runs-on: ubuntu-latest
    outputs:
      online: ${{ steps.runner.outputs.online }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether the runner is online
        id: runner
        uses: ./.github/actions/check-runner
        with:
          labels: mit,engaging,submitter
          token: ${{ secrets._GITHUB_API_KEY }}
          # Long enough to ride out the runner's relaunch at its 12-hour time limit or a preemption.
          wait-minutes: 60

  CleanWorkDirectory:
    needs: CheckEngaging
    if: ${{ needs.CheckEngaging.outputs.online == 'true' }}
    name: Clean work directory
    runs-on: [self-hosted, mit, engaging, submitter]
    # Each step records itself in the global logs repository (see launcher/record.sh), inside
    # GitHub's own default shell for bash. Until record.sh is on this machine (the first Update
    # codebase run is what brings it), a step runs in that shell unrecorded rather than failing.
    defaults:
      run:
        shell: bash --noprofile --norc -c "test -x /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh && exec /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh logs clean-workdir -- bash --noprofile --norc -eo pipefail $0; echo record.sh not found, running unrecorded >&2; exec bash --noprofile --norc -eo pipefail $0" {0}

    steps:
      - name: Clean cached work directory
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: dandicompute clean --base /orcd/data/dandi/001/dandi-compute --work

      # launcher/launch_submitter.sh points the DANDI CLI's logs here, one file per call.
      - name: Delete DANDI CLI logs older than 30 days
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: |
          LOG_DIRECTORY=/orcd/data/dandi/001/dandi-compute/state/dandi-cli/log
          if [ -d "$LOG_DIRECTORY" ]; then
            echo "Deleted $(find "$LOG_DIRECTORY" -type f -name '*.log' -mtime +30 -print -delete | wc -l) log(s) from $LOG_DIRECTORY"
          else
            echo "No $LOG_DIRECTORY yet"
          fi

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckEngaging, CleanWorkDirectory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check 24-hour cooldown
        id: cooldown
        uses: ./.github/actions/check-cooldown
        with:
          workflow_file: clean-workdir.yml
          token: ${{ github.token }}

      - name: Send email notification on failure
        if: ${{ steps.cooldown.outputs.should_notify == 'true' }}
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI Compute: monthly work directory cleanup failed"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: DANDI Compute <dandi-compute@users.noreply.github.com>
          body: |
            The scheduled monthly cleanup of ./work/ encountered an issue.
            Please check status at: https://github.com/dandi-compute/dandi-compute-runner/actions/workflows/clean-workdir.yml
