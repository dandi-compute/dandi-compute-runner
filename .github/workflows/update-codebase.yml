name: Update codebase

on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Which checkout on the cluster to pull, or `all` for every one."
        required: true
        type: choice
        default: all
        options:
          - all
          - dandi-compute-core
          - dandi-compute-runner
          - aind-ephys-pipeline
          - simple-s3-backup
      reinstall:
        description: "Run `pip install -e` on each pulled directory (only applies to installable Python packages; simple-s3-backup goes into its own environment)."
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DANDICOMPUTE_OOP_FAILSAFE_LOG: ${{ vars.DANDICOMPUTE_OOP_FAILSAFE_LOG }}

jobs:
  UpdateCodebase:
    name: Update codebase
    # Started by hand, so there is no runner check: while the runner is offline the job waits for it
    # ("Waiting for a runner to pick up this job") and runs once it is back.
    runs-on: [self-hosted, mit, engaging, submitter]
    # Each step records itself in the global logs repository (see launcher/record.sh), inside
    # GitHub's own default shell for bash. Until record.sh is on this machine (the first Update
    # codebase run is what brings it), a step runs in that shell unrecorded rather than failing.
    defaults:
      run:
        shell: bash --noprofile --norc -c "test -x /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh && exec /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh logs update-codebase -- bash --noprofile --norc -eo pipefail $0; echo record.sh not found, running unrecorded >&2; exec bash --noprofile --norc -eo pipefail $0" {0}
    env:
      DIRECTORIES: ${{ inputs.directory == 'all' && 'dandi-compute-core dandi-compute-runner aind-ephys-pipeline simple-s3-backup' || inputs.directory }}
      # The checkout of https://github.com/dandi/simple-s3-backup whose scripts the crontab's
      # backup jobs submit (see launcher/backup.sh), and the environment they run it from.
      BACKUP_CHECKOUT: /orcd/data/dandi/001/backup/simple-s3-backup
      BACKUP_ENVIRONMENT: /orcd/data/dandi/001/environments/name-s3+backup_env

    steps:
      - name: Pull codebase
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: |
          for directory in $DIRECTORIES; do
            if [ "$directory" = simple-s3-backup ]; then
              # The backup jobs run whatever this checkout holds, so it is always put on main, even
              # when someone checked out another branch there by hand. That branch stays, unchanged.
              # From June to November 2026 an unmerged branch checked out here stopped the blob
              # backup without anyone knowing.
              echo "Putting $BACKUP_CHECKOUT on main"
              git -C "$BACKUP_CHECKOUT" fetch --prune origin
              previous=$(git -C "$BACKUP_CHECKOUT" rev-parse --abbrev-ref HEAD)
              git -C "$BACKUP_CHECKOUT" checkout --force -B main origin/main
              echo "Was on ${previous}; now on main at $(git -C "$BACKUP_CHECKOUT" log -1 --format='%h %s')."
              continue
            fi
            echo "Pulling ./$directory/"
            git -C "./$directory/" fetch --tags origin
            # A detached checkout (aind-ephys-pipeline sits on whichever tag the last job checked out)
            # has no upstream to reset to. Each job checks out its own tag, so fetching is enough.
            if git -C "./$directory/" symbolic-ref -q HEAD > /dev/null; then
              git -C "./$directory/" reset --hard "@{u}"
            else
              echo "./$directory/ is on a detached HEAD; fetched new tags without resetting."
            fi
            if [ -d "./$directory/launcher" ]; then
              find "./$directory/launcher/" -maxdepth 1 -type f ! -name "crontab" -exec chmod +x {} +
            fi
          done

      # launcher/record.sh records every step with DataLad and duct from this environment, and
      # falls back to plain git while it is missing.
      - name: Provision DataLad environment
        env:
          DATALAD_ENVIRONMENT: /orcd/data/dandi/001/environments/name-datalad_env
        run: |
          if "$DATALAD_ENVIRONMENT/bin/datalad" --version 2> /dev/null && "$DATALAD_ENVIRONMENT/bin/con-duct" run --help > /dev/null 2>&1; then
            echo "DataLad and con-duct are already in $DATALAD_ENVIRONMENT."
            exit 0
          fi
          if ! command -v conda > /dev/null; then
            source /etc/profile.d/modules.sh
            module load miniforge
          fi
          if [ -d "$DATALAD_ENVIRONMENT/conda-meta" ]; then
            conda install -y -p "$DATALAD_ENVIRONMENT" -c conda-forge --override-channels datalad "con-duct>=0.17"
          else
            conda create -y -p "$DATALAD_ENVIRONMENT" -c conda-forge --override-channels datalad "con-duct>=0.17"
          fi
          "$DATALAD_ENVIRONMENT/bin/datalad" --version
          "$DATALAD_ENVIRONMENT/bin/con-duct" --version

      # AIND capsules run Nextflow from the environment dandi-compute-core names for them. AIND
      # ephys pipeline 1.5.0 needs Nextflow 25.10 or later for its nf-schema plugin. The plugin is
      # installed here once, so capsules starting together do not all download it into ~/.nextflow.
      - name: Provision Nextflow environment
        env:
          NEXTFLOW_ENVIRONMENT: /orcd/data/dandi/001/environments/name-nextflow_version-25+10+4_environment
          NEXTFLOW_VERSION: 25.10.4
          NF_SCHEMA_PLUGIN: nf-schema@2.7.3
        run: |
          if ! command -v conda > /dev/null; then
            source /etc/profile.d/modules.sh
            module load miniforge
          fi
          # `conda run` activates the environment, which is what points Nextflow at its own Java.
          INSTALLED=$(conda run -p "$NEXTFLOW_ENVIRONMENT" nextflow -version 2> /dev/null || true)
          if grep -q "version ${NEXTFLOW_VERSION} " <<< "$INSTALLED"; then
            echo "Nextflow ${NEXTFLOW_VERSION} is already in $NEXTFLOW_ENVIRONMENT."
          else
            if [ -d "$NEXTFLOW_ENVIRONMENT/conda-meta" ]; then
              conda install -y -p "$NEXTFLOW_ENVIRONMENT" -c conda-forge -c bioconda --override-channels "nextflow=${NEXTFLOW_VERSION}" python pip
            else
              conda create -y -p "$NEXTFLOW_ENVIRONMENT" -c conda-forge -c bioconda --override-channels "nextflow=${NEXTFLOW_VERSION}" python pip
            fi
            # Each capsule upgrades the DANDI CLI itself before uploading.
            "$NEXTFLOW_ENVIRONMENT/bin/pip" install dandi
          fi
          conda run -p "$NEXTFLOW_ENVIRONMENT" nextflow -version
          conda run -p "$NEXTFLOW_ENVIRONMENT" nextflow plugin install "$NF_SCHEMA_PLUGIN"

      - name: Reinstall package
        if: ${{ inputs.reinstall }}
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: |
          for directory in $DIRECTORIES; do
            if [ "$directory" = simple-s3-backup ]; then
              # Into the backup jobs' own environment, not the runner's.
              "$BACKUP_ENVIRONMENT/bin/pip" install -e "$BACKUP_CHECKOUT"
            elif [ -f "./$directory/pyproject.toml" ] || [ -f "./$directory/setup.py" ]; then
              pip install -e "./$directory/"
            else
              echo "No installable Python package found in ./$directory/; skipping reinstall."
            fi
          done

  # A new AIND pipeline tag arrives with the pull above, and its step images have to be cached
  # before any capsule formed against it runs. Nothing is submitted when every image is cached.
  UpdateContainerImages:
    needs: UpdateCodebase
    name: Update container images
    uses: ./.github/workflows/update-container-images.yml
    secrets: inherit
