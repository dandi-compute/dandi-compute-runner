name: Update codebase

on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Which cloned directory (under the cluster data root) to pull, or `all` for every one."
        required: true
        type: choice
        default: all
        options:
          - all
          - dandi-compute-core
          - dandi-compute-runner
          - aind-ephys-pipeline
      reinstall:
        description: "Run `pip install -e` on each pulled directory (only applies to installable Python packages)."
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DANDICOMPUTE_OOP_FAILSAFE_LOG: ${{ vars.DANDICOMPUTE_OOP_FAILSAFE_LOG }}

jobs:
  CheckEngaging:
    name: Pre-run Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          labels: mit,engaging,submitter
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateCodebase:
    needs: CheckEngaging
    name: Update codebase
    runs-on: [self-hosted, mit, engaging, submitter]
    # Each step records itself in the global logs repository (see launcher/record.sh), inside
    # GitHub's own default shell for bash. Until record.sh is on this machine (the first Update
    # codebase run is what brings it), a step runs in that shell unrecorded rather than failing.
    defaults:
      run:
        shell: bash --noprofile --norc -c "test -x /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh && exec /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh logs update-codebase -- bash --noprofile --norc -eo pipefail $0; echo record.sh not found, running unrecorded >&2; exec bash --noprofile --norc -eo pipefail $0" {0}
    env:
      DIRECTORIES: ${{ inputs.directory == 'all' && 'dandi-compute-core dandi-compute-runner aind-ephys-pipeline' || inputs.directory }}

    steps:
      - name: Pull codebase
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: |
          for directory in $DIRECTORIES; do
            echo "Pulling ./$directory/"
            git -C "./$directory/" fetch --tags origin
            # A detached checkout (aind-ephys-pipeline sits on whichever tag the last job checked out)
            # has no upstream to reset to. Each job checks out its own tag, so fetching is enough.
            if git -C "./$directory/" symbolic-ref -q HEAD > /dev/null; then
              git -C "./$directory/" reset --hard "@{u}"
            else
              echo "./$directory/ is on a detached HEAD; fetched new tags without resetting."
            fi
            if [ -d "./$directory/launcher" ]; then
              find "./$directory/launcher/" -maxdepth 1 -type f ! -name "crontab" -exec chmod +x {} +
            fi
          done

      # launcher/record.sh records every step with DataLad and duct from this environment, and
      # falls back to plain git while it is missing.
      - name: Provision DataLad environment
        env:
          DATALAD_ENVIRONMENT: /orcd/data/dandi/001/environments/name-datalad_env
        run: |
          if "$DATALAD_ENVIRONMENT/bin/datalad" --version 2> /dev/null && "$DATALAD_ENVIRONMENT/bin/con-duct" run --help > /dev/null 2>&1; then
            echo "DataLad and con-duct are already in $DATALAD_ENVIRONMENT."
            exit 0
          fi
          if ! command -v conda > /dev/null; then
            source /etc/profile.d/modules.sh
            module load miniforge
          fi
          if [ -d "$DATALAD_ENVIRONMENT/conda-meta" ]; then
            conda install -y -p "$DATALAD_ENVIRONMENT" -c conda-forge --override-channels datalad "con-duct>=0.17"
          else
            conda create -y -p "$DATALAD_ENVIRONMENT" -c conda-forge --override-channels datalad "con-duct>=0.17"
          fi
          "$DATALAD_ENVIRONMENT/bin/datalad" --version
          "$DATALAD_ENVIRONMENT/bin/con-duct" --version

      - name: Reinstall package
        if: ${{ inputs.reinstall }}
        working-directory: /orcd/data/dandi/001/dandi-compute
        run: |
          for directory in $DIRECTORIES; do
            if [ -f "./$directory/pyproject.toml" ] || [ -f "./$directory/setup.py" ]; then
              pip install -e "./$directory/"
            else
              echo "No installable Python package found in ./$directory/; skipping reinstall."
            fi
          done

  # A new AIND pipeline tag arrives with the pull above, and its step images have to be cached
  # before any capsule formed against it runs. Nothing is submitted when every image is cached.
  UpdateContainerImages:
    needs: UpdateCodebase
    name: Update container images
    uses: ./.github/workflows/update-container-images.yml
    secrets: inherit
