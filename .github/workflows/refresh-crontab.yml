name: Refresh crontab

# The cluster's periodic cleanup can wipe the user crontab on the login node. Every cron entry
# stops with it, including the ones that relaunch the runner and start the other workflows, and
# nothing on the cluster notices. This puts launcher/crontab back whenever it is missing or out of
# date. The schedule lives on GitHub, so it keeps running when the crontab is gone. That also makes
# it the one workflow that reports the runner being offline, once that has lasted 3 days; every
# other workflow skips its self-hosted job quietly while the runner is down.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DANDICOMPUTE_OOP_FAILSAFE_LOG: ${{ vars.DANDICOMPUTE_OOP_FAILSAFE_LOG }}

jobs:
  CheckEngaging:
    name: Check runner is online
    runs-on: ubuntu-latest
    outputs:
      online: ${{ steps.runner.outputs.online }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether the runner is online
        id: runner
        uses: ./.github/actions/check-runner
        with:
          labels: mit,engaging,submitter
          token: ${{ secrets._GITHUB_API_KEY }}

  RefreshCrontab:
    needs: CheckEngaging
    if: ${{ needs.CheckEngaging.outputs.online == 'true' }}
    name: Refresh crontab
    runs-on: [self-hosted, mit, engaging, submitter]
    # Each step records itself in the global logs repository (see launcher/record.sh), inside
    # GitHub's own default shell for bash. Until record.sh is on this machine (the first Update
    # codebase run is what brings it), a step runs in that shell unrecorded rather than failing.
    defaults:
      run:
        shell: bash --noprofile --norc -c "test -x /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh && exec /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/record.sh logs refresh-crontab -- bash --noprofile --norc -eo pipefail $0; echo record.sh not found, running unrecorded >&2; exec bash --noprofile --norc -eo pipefail $0" {0}

    steps:
      - name: Install the crontab if it is missing or out of date
        run: bash /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/install_crontab.sh

  # Most outages are short: the runner is relaunched minutes after its 12-hour time limit or a
  # preemption. So this fails the run, and with it sends the runner offline email, only once no run
  # of this workflow has reached the runner for OFFLINE_ALERT_HOURS.
  RunnerOfflineWatchdog:
    needs: CheckEngaging
    if: ${{ needs.CheckEngaging.outputs.online == 'false' }}
    name: Runner offline watchdog
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OFFLINE_ALERT_HOURS: 72
    steps:
      - name: Fail if the runner has been offline for 3 days
        run: |
          # The runners API has no last-seen time, so the runner counts as online at the start of
          # every run of this workflow whose self-hosted job it picked up, whatever that job's result.
          since=$(date -u -d "${OFFLINE_ALERT_HOURS} hours ago" '+%Y-%m-%dT%H:%M:%SZ')
          unknown="::warning title=Runner offline watchdog::Could not read the history of this workflow, so how long the runner has been offline is unknown. The next run checks again."
          if ! run_ids=$(gh api -X GET --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-crontab.yml/runs" \
              -f per_page=100 -f created=">=$since" --jq '.workflow_runs[].id'); then
            echo "$unknown"
            exit 0
          fi
          for run_id in $run_ids; do
            if ! last_online=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
                --jq '[.jobs[] | select(any(.labels[]; . == "self-hosted") and .runner_name != null) | .started_at] | .[0] // empty'); then
              echo "$unknown"
              exit 0
            fi
            if [ -n "$last_online" ]; then
              echo "The runner was last online at $last_online (run $run_id), less than ${OFFLINE_ALERT_HOURS} hours ago, so no email is sent yet."
              exit 0
            fi
          done
          message="No run of this workflow since $since has reached the self-hosted runner, so it has been offline for at least ${OFFLINE_ALERT_HOURS} hours."
          echo "::error title=Runner offline for ${OFFLINE_ALERT_HOURS} hours::$message"
          {
            echo "### Runner offline for ${OFFLINE_ALERT_HOURS} hours"
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckEngaging, RefreshCrontab, RunnerOfflineWatchdog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check 24-hour cooldown
        id: cooldown
        uses: ./.github/actions/check-cooldown
        with:
          workflow_file: refresh-crontab.yml
          token: ${{ github.token }}
          # Separate step names keep separate cooldowns, so a runner offline email does not
          # hold back a later email about the workflow itself failing.
          step_name: ${{ needs.RunnerOfflineWatchdog.result == 'failure' && 'Send runner offline notification' || 'Send email notification on failure' }}

      - name: ${{ needs.RunnerOfflineWatchdog.result == 'failure' && 'Send runner offline notification' || 'Send email notification on failure' }}
        if: ${{ steps.cooldown.outputs.should_notify == 'true' }}
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ needs.RunnerOfflineWatchdog.result == 'failure' && 'DANDI Compute: MIT Engaging runner offline for 3 days' || 'DANDI Compute: reinstalling the crontab failed' }}"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: DANDI Compute <dandi-compute@users.noreply.github.com>
          body: |
            ${{ needs.RunnerOfflineWatchdog.result == 'failure' && 'The MIT Engaging submitter runner has been offline for 3 days, so no workflow has run on the cluster since. The crontab on the login node relaunches it, so the crontab may have been wiped: reinstall it from a login node shell with `crontab /orcd/data/dandi/001/dandi-compute/dandi-compute-runner/launcher/crontab`.' || 'The crontab on the login node could not be checked or reinstalled; the error is in the run log.' }}
            Please check status at: https://github.com/dandi-compute/dandi-compute-runner/actions/workflows/refresh-crontab.yml
